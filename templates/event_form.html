{% extends 'base.html' %}{% block content %}<a class="back" href="{{url_for('admin_dashboard')}}">← Dashboard</a><div class="form-layout"><div><p class="eyebrow">EVENT SETUP</p><h1>{{'Edit event' if event else 'Create an event'}}</h1><p>New events start as drafts and remain hidden until published.</p></div><form method="post" class="panel form-grid"><label class="wide">Title<input name="title" value="{{event.title if event else ''}}" required></label><label class="wide">Description<textarea name="description" rows="5" required>{{event.description if event else ''}}</textarea></label><label>Date<input type="date" name="event_date" value="{{event.event_date if event else ''}}" required></label><label>Time<input type="time" name="event_time" value="{{event.event_time if event else ''}}" required></label><label>Location<input name="location" value="{{event.location if event else ''}}" required></label><label>Capacity<input type="number" min="1" step="1" name="capacity" value="{{event.capacity if event else ''}}" required></label><button class="button wide">{{'Save changes' if event else 'Save as draft'}}</button></form></div>{% endblock %}
